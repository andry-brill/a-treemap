name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.3', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: matrix.flutter != 'stable'
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - uses: subosito/flutter-action@v2
        if: matrix.flutter == 'stable'
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
        working-directory: example
      - run: flutter test
        working-directory: example
      - run: dart run benchmark/layout_benchmark.dart --verify
      - run: flutter build web
        working-directory: example
      - run: dart pub publish --dry-run
